name: Build QtWebEngineCore with Proprietary Codecs

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: 'Qt version (e.g. 6.12.0)'
        required: true
        default: '6.12.0'

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Free Disk Space on Windows
        run: |
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\ProgramData\chocolatey\lib" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Ruby" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\go" -Recurse -Force -ErrorAction SilentlyContinue
          Get-PSDrive C, D

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Build Dependencies (Ninja, Gperf, Bison, Flex)
        run: |
          pip install -U aqtinstall ninja
          choco install winflexbison3 gperf nodejs -y

      - name: Install Qt 6.12.0 Binaries
        id: install_qt
        run: |
          $qtVer = "${{ github.event.inputs.qt_version }}"
          "qt_ver=$qtVer" >> $env:GITHUB_OUTPUT

          @"
          [aqt]
          concurrency: 4
          baseurl: https://berkeley.edu

          [requests]
          connection_timeout: 15
          response_timeout: 60
          max_retries_on_connection_error: 10
          retry_backoff: 1.0
          max_retries_to_retrieve_hash: 10
          INSECURE_NOT_FOR_PRODUCTION_ignore_hash: True

          [mirrors]
          trusted_mirrors: https://berkeley.edu https://dotsrc.org https://download.qt.io
          fallbacks: https://dotsrc.org https://jaist.ac.jp
          "@ | Out-File -FilePath D:\aqt_settings.ini -Encoding ascii

          $archList = (aqt -c D:\aqt_settings.ini list-qt windows desktop --arch $qtVer) -split '\s+'
          Write-Host "Available architectures: $($archList -join ', ')"
          $arch = $archList | Where-Object { $_ -match "msvc" -and $_ -notmatch "arm" } | Select-Object -First 1
          if (-not $arch) { $arch = "win64_msvc2022_64" }
          Write-Host "Selected Qt Architecture: $arch"

          aqt -c D:\aqt_settings.ini install-qt windows desktop $qtVer $arch -m qtwebengine qtpositioning qtwebchannel -O D:\Qt
          if (-not (Test-Path "D:\Qt\$qtVer")) {
            throw "Failed to install Qt $qtVer!"
          }
          Get-ChildItem -Path "D:\Qt\$qtVer" -Depth 2

      - name: Clone Matching QtWebEngine Source from Git
        run: |
          $qtVer = "${{ steps.install_qt.outputs.qt_ver }}"
          Write-Host "Cloning qtwebengine branch v$qtVer"
          git clone --depth 1 --branch "v$qtVer" https://qt.io D:\qtwebengine-src
          cd D:\qtwebengine-src
          git submodule update --init --recursive --depth 1

      - name: Configure and Build QtWebEngine with MSVC
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64

          for /f "delims=" %%f in ('dir /b /s D:\Qt\qt-configure-module.bat') do set QT_CONF=%%f
          echo Qt Configure Script: %QT_CONF%

          mkdir D:\build
          cd /d D:\build
          call "%QT_CONF%" D:\qtwebengine-src -webengine-proprietary-codecs
          cmake --build . --parallel

      - name: Package DLL and Resources
        run: |
          mkdir D:\output
          copy D:\build\bin\Qt6WebEngineCore.dll D:\output\
          if (Test-Path D:\build\resources) { xcopy /E /I D:\build\resources D:\output\resources\ }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qt6WebEngineCore-6.12.0-Codecs
          path: D:\output\
          retention-days: 5
