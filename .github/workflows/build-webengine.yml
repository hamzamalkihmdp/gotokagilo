name: Build Qt6WebEngineCore (6.12.0 + Codecs)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Maximize Disk Space
        shell: pwsh
        run: |
          Remove-Item -Path "C:\ProgramData\Microsoft\AndroidNDK*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Java*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\go*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Ruby*" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja & Tools
        shell: pwsh
        run: |
          choco install ninja python3 nodejs -y --no-progress
          python -m pip install html5lib

      - name: Install Qt 6.12.0 via aqtinstall (Fixed Master Zip)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "https://github.com"
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 -O C:\Qt -m qtpositioning qtwebchannel qtwebsockets --base https://download.qt.io
          echo "Qt6_DIR=C:\Qt\6.12.0\msvc2022_64" >> $env:GITHUB_ENV
          echo "C:\Qt\6.12.0\msvc2022_64\bin" >> $env:GITHUB_PATH

      - name: Clone QtWebEngine 6.12.0 Source
        shell: pwsh
        run: |
          if (!(Test-Path "qtwebengine")) {
            git clone --branch 6.12.0 --depth 1 https://qt.io
            cd qtwebengine
            git submodule update --init --depth 1
          }

      - name: Restore Build Cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: qt6-webengine-build-6.12.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qt6-webengine-build-6.12.0-

      - name: Configure QtWebEngine (With Codecs)
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S qtwebengine -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
            -DFEATURE_webengine_proprietary_codecs=ON `
            -DFEATURE_webengine_full_debug_info=OFF `
            -DQT_BUILD_EXAMPLES=OFF `
            -DQT_BUILD_TESTS=OFF

      - name: Build QtWebEngineCore (Fast 4-Core + Safe 5-Hour Checkpoint)
        timeout-minutes: 300
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --target QtWebEngineCore --parallel 4

      - name: Clean Temporary Files Before Caching
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Include *.pdb,*.ilk -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Check & Upload Qt6WebEngineCore.dll
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qt6WebEngineCore-6.12.0-Codecs
          path: |
            build/bin/Qt6WebEngineCore.dll
            build/lib/Qt6WebEngineCore.lib
          if-no-files-found: ignore
