name: Build QtWebEngineCore 6.12.0 with Proprietary Codecs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Free Disk Space on Windows
        run: |
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\ProgramData\chocolatey\lib" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Ruby" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\go" -Recurse -Force -ErrorAction SilentlyContinue
          Get-PSDrive C, D

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Build Dependencies (Ninja, Gperf, Bison, Flex, Node.js)
        run: |
          pip install -U ninja html5lib
          choco install winflexbison3 gperf nodejs -y

      - name: Cache Prebuilt Qt Base Modules
        id: cache-qtbase
        uses: actions/cache@v4
        with:
          path: D:\Qt6-Install
          key: qt6-base-6.12.0-win64-v1

      - name: Clone Qt 6.12.0 Required Modules from Official Git
        shell: cmd
        run: |
          mkdir D:\qt6-src
          set PROTO=https://
          set HOST=github.com
          set ORG=qt
          
          if not exist "D:\Qt6-Install\bin\qt-configure-module.bat" (
            for %%m in (qtbase qtshadertools qtdeclarative qtpositioning qtwebchannel) do (
              echo Cloning %%m v6.12.0 ...
              git clone --depth 1 --branch v6.12.0 %PROTO%%HOST%/%ORG%/%%m.git D:\qt6-src\%%m
              if errorlevel 1 exit /b 1
            )
          )
          
          echo Cloning qtwebengine branch 6.12 ...
          git clone --depth 1 --branch 6.12 %PROTO%%HOST%/%ORG%/qtwebengine.git D:\qt6-src\qtwebengine
          if errorlevel 1 (
            git clone --depth 1 --branch dev %PROTO%%HOST%/%ORG%/qtwebengine.git D:\qt6-src\qtwebengine
            if errorlevel 1 exit /b 1
          )
          
          cd /d D:\qt6-src\qtwebengine
          git submodule update --init --recursive --depth 1
          if errorlevel 1 exit /b 1

      - name: Build Qt Base Modules (If Not Cached)
        if: steps.cache-qtbase.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          set PATH=%PATH%;C:\ProgramData\chocolatey\bin

          for %%m in (qtbase qtshadertools qtdeclarative qtpositioning qtwebchannel) do (
            echo ==========================================
            echo Configuring and Building %%m
            echo ==========================================
            mkdir D:\build-%%m
            cd /d D:\build-%%m
            if "%%m"=="qtbase" (
              cmake -G Ninja D:\qt6-src\qtbase -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=D:\Qt6-Install -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF -DBUILD_WITH_PCH=ON
            ) else (
              call D:\Qt6-Install\bin\qt-configure-module.bat D:\qt6-src\%%m -- -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF
            )
            if errorlevel 1 exit /b 1
            cmake --build . --parallel
            if errorlevel 1 exit /b 1
            cmake --install .
            if errorlevel 1 exit /b 1
          )

      - name: Build QtWebEngineCore Only (Fast Release Build)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          set PATH=%PATH%;C:\ProgramData\chocolatey\bin

          mkdir D:\build-webengine
          cd /d D:\build-webengine
          
          REM Build ONLY WebEngineCore target with proprietary codecs and disabled extra features to save 90+ minutes
          call D:\Qt6-Install\bin\qt-configure-module.bat D:\qt6-src\qtwebengine -webengine-proprietary-codecs -no-webengine-spellchecker -no-webengine-printing-and-pdf -- -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF -DFEATURE_webengine_quick=OFF -DFEATURE_webengine_widgets=OFF
          if errorlevel 1 exit /b 1
          
          REM Target specifically WebEngineCore DLL instead of building all auxiliary tools
          cmake --build . --target WebEngineCore --parallel
          if errorlevel 1 exit /b 1

      - name: Package DLL and Resources
        run: |
          mkdir D:\output
          $dll = (Get-ChildItem -Path "D:\build-webengine" -Filter "Qt6WebEngineCore.dll" -Recurse | Select-Object -First 1).FullName
          Write-Host "Found DLL at: $dll"
          copy $dll D:\output\
          
          $resDir = (Get-ChildItem -Path "D:\build-webengine" -Filter "resources" -Directory -Recurse | Select-Object -First 1).FullName
          if ($resDir) { xcopy /E /I $resDir D:\output\resources\ }
          Get-ChildItem D:\output

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qt6WebEngineCore-6.12.0-Codecs
          path: D:\output\
          retention-days: 5
