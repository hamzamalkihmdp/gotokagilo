name: Build QtWebEngineCore 6.12.0 with Proprietary Codecs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      - name: Free Disk Space on Windows
        run: |
          Remove-Item -Path "C:\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\ProgramData\chocolatey\lib" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Ruby" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\go" -Recurse -Force -ErrorAction SilentlyContinue
          Get-PSDrive C, D

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Build Dependencies (Ninja, Gperf, Bison, Flex, Node.js)
        run: |
          pip install -U ninja html5lib
          choco install winflexbison3 gperf nodejs -y

      - name: Clone Qt 6.12.0 Required Modules from Official Git
        run: |
          mkdir D:\qt6-src
          cd D:\qt6-src
          $modules = @("qtbase", "qtshadertools", "qtdeclarative", "qtpositioning", "qtwebchannel", "qtwebengine")
          foreach ($mod in $modules) {
            Write-Host "Cloning $mod (v6.12.0)..."
            git clone --depth 1 --branch v6.12.0 "https://qt.io" "D:\qt6-src\$mod"
          }
          cd D:\qt6-src\qtwebengine
          git submodule update --init --recursive --depth 1

      - name: Build Qt Base Modules and QtWebEngine (Proprietary Codecs)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS_PATH=%%i
          call "%VS_PATH%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64

          set PATH=C:\ProgramData\chocolatey\bin;%PATH%

          REM 1. Build minimal Qt prerequisites (qtbase, qtshadertools, qtdeclarative, qtpositioning, qtwebchannel)
          for %%m in (qtbase qtshadertools qtdeclarative qtpositioning qtwebchannel) do (
            echo ==========================================
            echo Configuring and Building %%m
            echo ==========================================
            mkdir D:\build-%%m
            cd /d D:\build-%%m
            if "%%m"=="qtbase" (
              cmake -G Ninja D:\qt6-src\qtbase -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=D:\Qt6-Install -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF
            ) else (
              call D:\Qt6-Install\bin\qt-configure-module.bat D:\qt6-src\%%m -- -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF
            )
            cmake --build . --parallel
            cmake --install .
          )

          REM 2. Configure and Build QtWebEngine with Proprietary Codecs
          echo ==========================================
          echo Configuring and Building QtWebEngine
          echo ==========================================
          mkdir D:\build-webengine
          cd /d D:\build-webengine
          call D:\Qt6-Install\bin\qt-configure-module.bat D:\qt6-src\qtwebengine -webengine-proprietary-codecs -- -DQT_BUILD_EXAMPLES=OFF -DQT_BUILD_TESTS=OFF
          cmake --build . --parallel
          cmake --install .

      - name: Package DLL and Resources
        run: |
          mkdir D:\output
          copy D:\Qt6-Install\bin\Qt6WebEngineCore.dll D:\output\
          if (Test-Path D:\Qt6-Install\resources) { xcopy /E /I D:\Qt6-Install\resources D:\output\resources\ }
          Get-ChildItem D:\output

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Qt6WebEngineCore-6.12.0-Codecs
          path: D:\output\
          retention-days: 5
