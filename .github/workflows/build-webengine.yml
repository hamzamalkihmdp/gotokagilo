name: Build Qt6WebEngineCore (6.12.0 + Codecs)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Maximize Disk Space
        shell: pwsh
        run: |
          Remove-Item -Path "C:\ProgramData\Microsoft\AndroidNDK*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Java*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\go*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Ruby*" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja, Bison, Flex, GPerf & Python Tools
        shell: pwsh
        run: |
          choco install ninja nodejs gperf winflexbison3 -y --no-progress
          refreshenv
          python -m pip install --upgrade pip html5lib

      - name: Checkout Latest aqtinstall
        uses: actions/checkout@v4
        with:
          repository: miurahr/aqtinstall
          path: aqt-src

      - name: Install Qt 6.12.0
        shell: pwsh
        run: |
          python -m pip install ./aqt-src
          python -m aqt install-qt windows desktop 6.12.0 win64_msvc2022_64 -O C:\Qt -m qtpositioning qtwebchannel qtwebsockets
          echo "Qt6_DIR=C:\Qt\6.12.0\msvc2022_64" >> $env:GITHUB_ENV
          echo "C:\Qt\6.12.0\msvc2022_64\bin" >> $env:GITHUB_PATH

      - name: Checkout QtWebEngine 6.12 Source
        uses: actions/checkout@v4
        with:
          repository: qt/qtwebengine
          ref: '6.12'
          path: qtwebengine
          submodules: true

      - name: Restore Build Cache
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build
          key: qt6-webengine-build-v3-6.12.0-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            qt6-webengine-build-v3-6.12.0-

      - name: Configure QtWebEngine (With Codecs)
        if: steps.cache-build.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $env:PATH = "C:\ProgramData\chocolatey\bin;" + $env:PATH
          C:\Qt\6.12.0\msvc2022_64\bin\qt-cmake.bat -S qtwebengine -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DFEATURE_webengine_proprietary_codecs=ON `
            -DFEATURE_webengine_full_debug_info=OFF `
            -DQT_BUILD_EXAMPLES=OFF `
            -DQT_BUILD_TESTS=OFF
          
          # التأكد من أن WebEngineCore مفعّل وإلا إيقاف البناء فوراً لعرض السبب
          $targets = cmake --build build --target help
          if ($targets -notmatch "WebEngineCore") {
            Write-Error "WebEngineCore was disabled during configure! Check the CMake summary above for missing dependencies."
            exit 1
          }

      - name: Build QtWebEngineCore (Fast 4-Core + Safe 5-Hour Checkpoint)
        timeout-minutes: 300
        continue-on-error: true
        shell: pwsh
        run: |
          cmake --build build --parallel 4

      - name: Clean Temporary Files Before Caching
        shell: pwsh
        run: |
          Get-ChildItem -Path build -Include *.pdb,*.ilk -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Check & Upload Qt6WebEngineCore.dll
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Qt6WebEngineCore-6.12.0-Codecs
          path: |
            build/bin/Qt6WebEngineCore.dll
            build/lib/Qt6WebEngineCore.lib
          if-no-files-found: ignore
